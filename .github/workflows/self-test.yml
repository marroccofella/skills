      - name: A committed-range review is bound to that range (real temporary repository, zero provider calls)
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        run: node momm/scripts/governor-range.test.mjs
      - name: Every tracked source is reviewable text (no raw control bytes, nothing Git calls binary)
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node scripts/source-hygiene.test.mjs
      - name: Effectiveness scorecard and training export (read-only, synthetic evidence)
        if: ${{ !cancelled() }}
