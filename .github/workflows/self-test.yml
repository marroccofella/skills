name: Skill safety suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  self-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      # Zero model calls: the self-test exercises env scrubbing, recursion
      # guards, JSON parsing, and forced-timeout settlement deterministically.
      - name: Safety self-test
        run: node momm/scripts/multi-review.mjs --self-test --pretty
      - name: Doctor (no model calls)
        run: node momm/scripts/multi-review.mjs --doctor --pretty
      - name: Guided onboarding is zero-call and rejects unknown routes
        shell: node {0}
        run: |
          const { spawnSync } = require("node:child_process");
          const script = "momm/scripts/onboard.mjs";
          const safe = spawnSync(process.execPath, [script, "--governor", "codex", "--reviewers", "codex", "--json"], { encoding: "utf8", timeout: 30000 });
          if (safe.status !== 0) throw new Error("onboarding smoke failed: " + safe.stderr);
          const report = JSON.parse(safe.stdout);
          if (report.model_calls_made !== false || report.credential_contents_read !== false) throw new Error("onboarding privacy contract missing");
          if (report.routes.length !== 1 || report.routes[0].role !== "governor") throw new Error("governor was not self-excluded");
          for (const name of ["rerun", "setup_center"]) {
            const command = report.commands?.[name];
            if (!command || command.executable !== process.execPath || !Array.isArray(command.args) || !require("node:path").isAbsolute(command.args[0])) throw new Error(`onboarding ${name} command is not cross-harness structured argv`);
          }
          if (report.selected_reviewers?.length || report.commands.first_review !== null || !report.first_review_blocked_reason) throw new Error("governor-only onboarding published an impossible first-review command");
          const geminiOnly = spawnSync(process.execPath, [script, "--governor", "codex", "--reviewers", "gemini", "--json"], { encoding: "utf8", timeout: 30000 });
          if (geminiOnly.status !== 0) throw new Error("Gemini-only onboarding failed: " + geminiOnly.stderr);
          const gemini = JSON.parse(geminiOnly.stdout);
          const first = gemini.commands?.first_review;
          if (!first || first.executable !== process.execPath || !Array.isArray(first.args) || !require("node:path").isAbsolute(first.args[0])) throw new Error("Gemini-only first review is not cross-harness structured argv");
          const reviewerIndex = first.args.indexOf("--reviewers");
          if (JSON.stringify(gemini.selected_reviewers) !== JSON.stringify(["gemini"]) || reviewerIndex < 0 || first.args[reviewerIndex + 1] !== "gemini") throw new Error("Gemini-only first review omitted the selected external route");
          const unsafe = spawnSync(process.execPath, [script, "--governor", "codex", "--reviewers", "grok,\u001b[31mBAD"], { encoding: "utf8", timeout: 30000 });
          if (unsafe.status === 0 || unsafe.stderr.includes("\u001b")) throw new Error("unknown reviewer input was not safely rejected");
          console.log("guided onboarding is zero-call, self-excluding, and input-safe");
      - name: Local Setup Center safety contract
        # This self-test starts the live loopback server and proves forged
        # Host/Origin requests cannot reach /api/session or mutate state.
        run: node momm/scripts/setup-ui.mjs --self-test
      - name: Setup Center JavaScript syntax
        run: |
          node --check momm/scripts/multi-review.mjs
          node --check momm/scripts/ledger.mjs
          node --check momm/scripts/review-completion.mjs
          node --check momm/scripts/first-run-roundtrip.mjs
          node --check momm/scripts/oauth-env.mjs
          node --check momm/scripts/provider-manifest.mjs
          node --check momm/scripts/setup-probe-contract.mjs
          node --check momm/scripts/setup-ui.mjs
          node --check momm/assets/setup-ui/app.js
          node --check momm/scripts/setup-ui-contract-test.mjs
          node --check myskills/scripts/health-contract-test.mjs
      - name: Setup Center release UI contract
        run: node momm/scripts/setup-ui-contract-test.mjs
      - name: Private ledger read-aloud and honesty self-test
        run: node momm/scripts/ledger.mjs --self-test
      - name: Governor completion contract self-test
        run: node momm/scripts/review-completion.mjs --self-test
      - name: First-run review-to-completion round trip
        run: node momm/scripts/first-run-roundtrip.mjs
      - name: Attachment gate is private and provider-free
        shell: node {0}
        run: |
          const { spawnSync } = require("node:child_process");
          const fs = require("node:fs");
          const os = require("node:os");
          const path = require("node:path");
          const dir = fs.mkdtempSync(path.join(os.tmpdir(), "momm-media-gate-"));
          const before = new Set(fs.readdirSync(os.tmpdir()).filter((name) => name.startsWith("momm-attach-")));
          try {
            const script = path.resolve("momm/scripts/multi-review.mjs");
            const image = path.resolve("docs/momm/momm-poster.jpg");
            const result = spawnSync(process.execPath, [script, "--governor", "codex", "--reviewers", "copilot", "--attach", image, "--no-ui", "--allow-ephemeral-evidence"], { cwd: dir, encoding: "utf8", timeout: 30000, env: { ...process.env, NO_UPDATE_CHECK: "1", MULTI_LLM_REVIEW_DEPTH: "0" } });
            if (result.status !== 1 || !/No requested external reviewer can consume/.test(result.stderr)) throw new Error("incompatible media did not fail before provider dispatch: " + result.stderr);
            if (fs.existsSync(path.join(dir, ".ensemble_reviews"))) throw new Error("failed media preflight wrote review evidence");
            const leaked = fs.readdirSync(os.tmpdir()).filter((name) => name.startsWith("momm-attach-") && !before.has(name));
            if (leaked.length) throw new Error("private attachment staging leaked: " + leaked.join(","));
            console.log("attachment capability gate fails closed, leaves no evidence, and cleans staging");
          } finally {
            fs.rmSync(dir, { recursive: true, force: true });
          }
      - name: myrepo offline safety self-test
        run: node myrepo/scripts/publish.mjs --self-test
      - name: myskills integrated health contract
        run: node myskills/scripts/run-all.mjs --pretty
      - name: myskills canonical and quick-mode contract
        env:
          # Pull requests may carry an explicitly documented release candidate.
          # A push to main must match the published manifest exactly.
          MOMM_ALLOW_UNRELEASED_CANDIDATE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: node myskills/scripts/health-contract-test.mjs
      - name: Yorkshire pudding self-test
        run: node yorkshire-pudding/scripts/yorkshirify.mjs --self-test
      - name: Public evidence is sanitized and sealed
        shell: node {0}
        run: |
          const { createHash } = require("node:crypto");
          const fs = require("node:fs");
          const sourcePath = "docs/evidence/momm-evidence.json";
          const sourceBytes = fs.readFileSync(sourcePath);
          const source = JSON.parse(sourceBytes.toString("utf8"));
          const html = fs.readFileSync("docs/evidence/index.html", "utf8");
          const match = html.match(/<script id="data" type="application\/json">([\s\S]*?)<\/script>/);
          if (!match) throw new Error("public evidence page has no embedded data block");
          const embedded = JSON.parse(match[1]);
          const project = embedded.projects?.[0];
          if (!project || ["schema", "generated", "source", "sanitization"].some((key) => embedded[key] !== source[key])) throw new Error("public evidence page metadata is not bound to the sealed source");
          if (JSON.stringify(project.runs) !== JSON.stringify(source.runs.filter((run) => !run.event))) throw new Error("public evidence page run view drifted from the sealed source");
          if (JSON.stringify(project.dispositions) !== JSON.stringify(source.dispositions)) throw new Error("public evidence page legacy rows drifted from the sealed source");
          if (JSON.stringify(Object.keys(project.reports || {}).sort()) !== JSON.stringify(Object.keys(source.reports || {}).sort())) throw new Error("public evidence page report set drifted from the sealed source");
          for (const [runId, stored] of Object.entries(source.reports || {})) {
            const rendered = project.reports?.[runId];
            if (!rendered || rendered.sha256 !== stored.stored_report_sha256 || JSON.stringify(rendered.report) !== JSON.stringify(stored.report)) throw new Error(`public evidence page report ${runId} drifted from the sealed source`);
          }
          const forbidden = [
            /[A-Za-z]:[\\/]+Users[\\/]+[^\\/\s"']+/i,
            /[A-Za-z]:[\\/]+1code projects[\\/]+Claude/i,
            /(^|[\s"'(])\/(Users|home)\/[^/\s"']+/i,
          ];
          const scan = (label, value, at = "$") => {
            if (typeof value === "string") {
              if (forbidden.some((pattern) => pattern.test(value))) throw new Error(`${label} leaks a local path at ${at}: ${value}`);
              return;
            }
            if (Array.isArray(value)) return value.forEach((item, index) => scan(label, item, `${at}[${index}]`));
            if (value && typeof value === "object") for (const [key, item] of Object.entries(value)) scan(label, item, `${at}.${key}`);
          };
          scan("momm-evidence.json", source);
          scan("index.html embedded data", embedded);
          const expected = fs.readFileSync(`${sourcePath}.sha256`, "utf8").trim().split(/\s+/)[0];
          const actual = createHash("sha256").update(sourceBytes).digest("hex");
          if (actual !== expected) throw new Error(`public evidence digest mismatch: ${actual} != ${expected}`);
          console.log("public evidence contains no local home/workspace paths and matches its sidecar");
      # Legacy multi-llm-review alias must keep working until removal, and
      # with --stream its stderr must stay pure NDJSON (deprecation line included).
      # The private ledger generator must build from real telemetry and must
      # write only inside .ensemble_reviews/ (the locally excluded private zone).
      - name: Private ledger builds and stays private
        shell: node {0}
        run: |
          const { spawnSync } = require("node:child_process");
          const fs = require("node:fs");
          const path = require("node:path");
          const os = require("node:os");
          const dir = fs.mkdtempSync(path.join(os.tmpdir(), "momm-ledger-"));
          const review = spawnSync(process.execPath, [path.resolve("momm/scripts/multi-review.mjs"), "--governor", "codex", "--reviewers", "codex", "--label", "ledger smoke", "--allow-ephemeral-evidence"], { input: "artifact\n", encoding: "utf8", cwd: dir, timeout: 120000, env: { ...process.env, NO_UPDATE_CHECK: "1", MULTI_LLM_REVIEW_DEPTH: "0" } });
          if (review.status !== 0) throw new Error("seed review failed: " + (review.error?.code ?? review.signal ?? "exit " + review.status));
          const ledger = spawnSync(process.execPath, [path.resolve("momm/scripts/ledger.mjs")], { encoding: "utf8", cwd: dir, timeout: 60000 });
          if (ledger.status !== 0) throw new Error("ledger build failed: " + (ledger.error?.code ?? ledger.signal ?? ledger.stderr));
          const html = fs.readFileSync(path.join(dir, ".ensemble_reviews", "ledger.html"), "utf8");
          if (!html.includes("ledger smoke")) throw new Error("ledger missing run label");
          if (!html.includes("no verdict — 0/0 completed") || html.includes("0 findings")) throw new Error("self-excluded run is presented as a clean review");
          if (!html.includes("Read aloud") || !html.includes("localService === true")) throw new Error("local-only read-aloud contract missing");
          const outside = fs.readdirSync(dir).filter((f) => f !== ".ensemble_reviews");
          if (outside.length) throw new Error("ledger wrote outside the private zone: " + outside.join(","));
          // On POSIX runners, prove MOMM-created files request private modes.
          // Windows inherits the chosen directory's NTFS ACL, so no universal
          // owner-only claim is made there.
          if (process.platform !== "win32") {
            const er = path.join(dir, ".ensemble_reviews");
            const mode = (p) => fs.statSync(p).mode & 0o777;
            const dirMode = mode(er), ledgerMode = mode(path.join(er, "ledger.html"));
            const reportFile = path.join(er, "reports", fs.readdirSync(path.join(er, "reports"))[0]);
            const reportMode = mode(reportFile), logMode = mode(path.join(er, "review-log.jsonl"));
            if (dirMode & 0o077) throw new Error(".ensemble_reviews is group/other-accessible: " + dirMode.toString(8));
            if (ledgerMode & 0o077) throw new Error("ledger.html is group/other-readable: " + ledgerMode.toString(8));
            if (reportMode & 0o077) throw new Error("report is group/other-readable: " + reportMode.toString(8));
            if (logMode & 0o077) throw new Error("review-log is group/other-readable: " + logMode.toString(8));
            console.log("private evidence is owner-only (dir 0" + dirMode.toString(8) + ", files 0600)");
          }
          fs.rmSync(dir, { recursive: true, force: true });
          console.log("private ledger builds from telemetry and writes only inside .ensemble_reviews/");
      - name: Legacy alias forwards
        run: node multi-llm-review/scripts/multi-review.mjs --self-test --pretty
      - name: Legacy alias keeps --stream stderr NDJSON-pure
        shell: node {0}
        run: |
          const { spawnSync } = require("node:child_process");
          const r = spawnSync(process.execPath, ["multi-llm-review/scripts/multi-review.mjs", "--self-test", "--stream"], { encoding: "utf8" });
          const lines = r.stderr.trim().split(/\r?\n/).filter(Boolean);
          if (lines.length === 0) throw new Error("expected at least the deprecation event on stderr");
          for (const line of lines) JSON.parse(line);
          console.log(`ok: ${lines.length} stderr line(s), all valid JSON`);
      - name: Legacy install alias forwards (dry run)
        shell: node {0}
        run: |
          const { spawnSync } = require("node:child_process");
          const fs = require("node:fs");
          const os = require("node:os");
          const path = require("node:path");
          const dir = fs.mkdtempSync(path.join(os.tmpdir(), "momm-alias-install-"));
          try {
            const result = spawnSync(process.execPath, ["multi-llm-review/scripts/install.mjs", "--target", "auto", "--custom-dir", dir, "--dry-run"], { encoding: "utf8", timeout: 30000 });
            const report = JSON.parse(result.stdout);
            if (!result.stderr.includes("[deprecated]") || !report.results?.some((row) => row.target === "custom" && row.status === "would_link")) throw new Error("legacy installer did not forward its deterministic custom dry run");
            const conflicts = report.results.filter((row) => row.status === "conflict");
            const unexpected = report.results.filter((row) => !["would_link", "would_run_native_link", "already_linked", "canonical", "skipped", "conflict"].includes(row.status));
            if (unexpected.length || result.status !== (conflicts.length ? 1 : 0)) throw new Error("legacy installer returned an inconsistent dry-run result");
            console.log("legacy installer alias forwards without depending on the runner's existing skill links");
          } finally {
            fs.rmSync(dir, { recursive: true, force: true });
          }
      # Evidence round trip: a run (reviewer CLI absent in CI → fast terminal
      # status, zero model calls) must persist a report whose logged sha256
      # matches a fresh read of the file and whose input_sha256 matches the
      # exact piped artifact; forced persistence failure must warn on stderr
      # and report evidence.persisted=false while exiting with the dedicated
      # evidence-handoff failure code 4.
      - name: Evidence persistence round trip
        timeout-minutes: 5
        shell: node {0}
        run: |
          const { spawnSync } = require("node:child_process");
          const { createHash } = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");
          const os = require("node:os");
          const script = path.resolve("momm/scripts/multi-review.mjs");
          const artifact = "evidence round trip artifact\n";
          const dirs = [];
          const tmp = (label) => { const d = fs.mkdtempSync(path.join(os.tmpdir(), `momm-ci-${label}-`)); dirs.push(d); return d; };
          // governor codex + reviewers codex => deterministic self-exclusion:
          // zero subprocess spawns, zero network, independent of runner CLIs.
          const run = (cwd, extra = []) => spawnSync(process.execPath, [script, "--governor", "codex", "--reviewers", "codex", "--allow-ephemeral-evidence", ...extra], { input: artifact, encoding: "utf8", cwd, timeout: 120000, env: { ...process.env, NO_UPDATE_CHECK: "1", MULTI_LLM_REVIEW_DEPTH: "0" } });
          try {
            const workDir = tmp("ok");
            let r = run(workDir);
            if (r.status !== 0) throw new Error("run failed: " + r.stderr);
            const report = JSON.parse(r.stdout);
            if (!report.evidence.persisted || !report.evidence.log_indexed) throw new Error("evidence not fully persisted");
            if (report.evidence.report_sha256_covers !== "stored_report_bytes") throw new Error("digest coverage not declared");
            const stored = fs.readFileSync(path.join(workDir, report.evidence.report_path), "utf8");
            if (createHash("sha256").update(stored).digest("hex") !== report.evidence.report_sha256) throw new Error("report digest mismatch");
            const logLine = JSON.parse(fs.readFileSync(path.join(workDir, ".ensemble_reviews/review-log.jsonl"), "utf8").split("\n").filter(Boolean).pop());
            if (logLine.report_sha256 !== report.evidence.report_sha256) throw new Error("log digest mismatch");
            if (logLine.input_sha256 !== report.input_sha256) throw new Error("log/report input hash mismatch");
            if (report.input_sha256 !== createHash("sha256").update(artifact).digest("hex")) throw new Error("input not bound to artifact");
            if (report.reviewers[0].attempts !== 1) throw new Error("attempts not recorded");
            if ("input_text" in report) throw new Error("input stored without --store-input (privacy default broken)");
            r = run(workDir, ["--store-input"]);
            if (r.status !== 0) throw new Error("store-input run failed");
            if (JSON.parse(r.stdout).input_text !== artifact) throw new Error("--store-input did not persist the artifact");
            const blocked = tmp("blocked");
            fs.mkdirSync(path.join(blocked, ".ensemble_reviews"), { recursive: true });
            fs.writeFileSync(path.join(blocked, ".ensemble_reviews", ".momm-evidence-zone.json"), JSON.stringify({ schema: "momm-evidence-zone/1" }));
            fs.writeFileSync(path.join(blocked, ".ensemble_reviews", "reports"), "block");
            r = run(blocked);
            if (r.status !== 4) throw new Error("blocked persistence did not exit 4");
            const blockedReport = JSON.parse(r.stdout);
            if (blockedReport.evidence.persisted !== false || blockedReport.evidence.log_indexed !== false) throw new Error("blocked persistence not reported");
            if (!/evidence persistence failed \(report persistence\)/.test(r.stderr)) throw new Error("no stderr warning on persistence failure");
            const partial = tmp("partial");
            fs.mkdirSync(path.join(partial, ".ensemble_reviews", "review-log.jsonl"), { recursive: true });
            fs.writeFileSync(path.join(partial, ".ensemble_reviews", ".momm-evidence-zone.json"), JSON.stringify({ schema: "momm-evidence-zone/1" }));
            r = run(partial);
            if (r.status !== 4) throw new Error("partial persistence did not exit 4");
            const partialReport = JSON.parse(r.stdout);
            if (partialReport.evidence.persisted !== true || partialReport.evidence.log_indexed !== false) throw new Error("partial persistence misreported");
            if (!/evidence persistence failed \(review-log indexing\)/.test(r.stderr)) throw new Error("no stderr warning on indexing failure");
            if (!fs.existsSync(path.join(partial, partialReport.evidence.report_path))) throw new Error("partial run report file missing");
            const streamBlocked = tmp("stream");
            fs.mkdirSync(path.join(streamBlocked, ".ensemble_reviews"), { recursive: true });
            fs.writeFileSync(path.join(streamBlocked, ".ensemble_reviews", ".momm-evidence-zone.json"), JSON.stringify({ schema: "momm-evidence-zone/1" }));
            fs.writeFileSync(path.join(streamBlocked, ".ensemble_reviews", "reports"), "block");
            r = run(streamBlocked, ["--stream"]);
            if (r.status !== 4) throw new Error("stream persistence failure did not exit 4");
            const events = r.stderr.split(/\r?\n/).filter(Boolean).map((line) => JSON.parse(line));
            if (!events.some((e) => e.event === "evidence_error" && e.stage === "report persistence")) throw new Error("no structured evidence_error event");
            if (JSON.parse(r.stdout).evidence.persisted !== false) throw new Error("stream run persistence misreported");
            console.log("evidence round trip ok: full, blocked, partial, and stream-pure failure all behave as declared");
          } finally {
            for (const d of dirs) { try { fs.rmSync(d, { recursive: true, force: true }); } catch {} }
          }
