name: Skill safety suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  self-test:
    # The completed 167-command local Windows pack took 70m44s on 19 October.
    # Keep a finite bound with 25% execution headroom plus five minutes of setup.
    # This is a scheduling budget, not a hosted/platform qualification claim.
    timeout-minutes: 100
    runs-on: ${{ matrix.os }}
    env:
      NO_UPDATE_CHECK: '1'
      MOMM_NO_UPDATE_CHECK: '1'
      DO_NOT_TRACK: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 22/24 are primary; 18/20 are retained compatibility checks, not lifecycle proof.
        node-version: [18.x, 20.x, 22.x, 24.x]
        # Pinned patch releases, because 24.x resolves to whatever the runner has that day.
        # 24.15.0: the independently reported Windows fetch/forced-exit runtime.
        # 24.19.0: a reviewer reported an attachment-cleanup timeout there, and the matrix had
        # gone straight from 24.x = 24.20.0 past it, so nothing had ever run 24.19.
        include:
          - os: windows-latest
            node-version: '24.15.0'
          - os: windows-latest
            node-version: '24.19.0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      # Every step below carries the `!cancelled()` condition, so a failing suite no longer hides the steps
      # after it: one run shows every failure, and any failed step still fails the job (1.17.1 S9).
      # Zero model calls: the self-test exercises env scrubbing, recursion
      # guards, JSON parsing, and forced-timeout settlement deterministically.
      - name: Safety self-test
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node momm/scripts/multi-review.mjs --self-test --pretty
      - name: Media byte validation
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node momm/scripts/media-bytes.test.mjs
      - name: Scope audit closure and native export permissions
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: node momm/scripts/scope-closure.test.mjs
      - name: Installation completion boundary
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node momm/scripts/install-completion.test.mjs
      - name: Capability expiry refusal
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node momm/scripts/expiry-regression.test.mjs
      - name: Attempt accounting and tool-produced checks
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node momm/scripts/attempts.test.mjs
      - name: Evidence home outside the project (1.17 A7)
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: node momm/scripts/evidence-location.test.mjs
      - name: Suites started by hand with an evidence home set pass and leave it empty (1.17.2)
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        run: node scripts/evidence-home-isolation.test.mjs
      - name: Private quotation diagnostics (1.17 A4.2)
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node momm/scripts/quotation-diagnostics.test.mjs
      - name: One answer rule for every route and private answer shape (1.17.1 S1, S2)
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node momm/scripts/review-answer.test.mjs
      - name: Versioned adapter regression matrix (1.17.1 R2)
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node momm/scripts/adapter-matrix.test.mjs
      - name: Fail-closed Windows PATH identity
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node momm/scripts/path-resolution.test.mjs
      - name: Review-claim evidence regressions
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node momm/scripts/review-claims.test.mjs
      - name: CI deadlines and test catalog
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node momm/scripts/review-workflow.test.mjs
      - name: Final review regression controls
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node momm/scripts/review-final-regressions.test.mjs
      - name: Triage regressions from review rev_20260922162715
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node momm/scripts/review-triage-1161.test.mjs
      - name: Named security regression - executable resolution
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node momm/scripts/executable-resolution.test.mjs
      - name: Disputed review boundary controls
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node momm/scripts/review-refutations.test.mjs
      - name: Final candidate review follow-up regressions
        if: ${{ !cancelled() }}
