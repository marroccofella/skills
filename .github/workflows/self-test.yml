      - name: New and legacy install bootstrap trust boundaries (offline)
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node momm/scripts/bootstrap.test.mjs
      - name: Legacy discovery migration and rollback (synthetic installs only)
        if: ${{ !cancelled() }}
