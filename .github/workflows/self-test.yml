      - name: remembered CLI/model compatibility, repeated-status notice and gate-review guard (1.17.1 R1, S3, S4)
        if: ${{ !cancelled() }}
        # bash on every OS; both suites run, and the step fails if either failed (see the list below).
        shell: bash
        timeout-minutes: 4
        run: |
          failed=0; trap 'echo "::error::Suite failed: $BASH_COMMAND"; failed=1' ERR; set +e
          node momm/scripts/compatibility.test.mjs
          node momm/scripts/run-notices.test.mjs
          exit $failed
      - name: governor split/rating/direct rules (1.16)
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node momm/scripts/governor-split.test.mjs
      - name: modality registry, overlay and effective matrix (1.16 E7)
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node momm/scripts/capabilities.test.mjs
      - name: existing lock ownership is never stolen
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node momm/scripts/lock-ownership.test.mjs
      - name: modality planner and step-scoped runner (1.16 E7)
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: node momm/scripts/modality.test.mjs
      - name: modality runner regressions from the 1.16 readiness audit
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node momm/scripts/modality-evaluation.test.mjs
      - name: guided image generation rounds, fake runner only (1.17 E)
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: node momm/scripts/generation-rounds.test.mjs
      - name: Windows launch guard on every process-launching script
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node scripts/launch-guard.test.mjs
      - name: Public information is deterministic and internally linked
        if: ${{ !cancelled() }}
        # bash on every OS. Under the Windows default (PowerShell) only the LAST command's exit code
        # counted, so a failing suite in the middle of this list was reported green (found at the 1.16.0
        # release halt, run 35459186774). Plain bash stopped at the first failure, so each push showed
        # only the next one. The first line keeps the list running and names every failing suite; the
        # last line fails the step if any failed (1.17.1 S9).
        shell: bash
        timeout-minutes: 8
        run: |
          failed=0; trap 'echo "::error::Suite failed: $BASH_COMMAND"; failed=1' ERR; set +e
          node scripts/render-momm-site.mjs --check
          node scripts/check-momm-site.mjs
          node scripts/momm-release-pages.test.mjs
          node scripts/public-export.test.mjs
          node scripts/doc-consistency.test.mjs
          node scripts/momm-release-privacy.test.mjs
          node scripts/momm-media-contract.test.mjs
          node scripts/ledger-integrity.test.mjs
          node scripts/ledger-media.test.mjs
          node scripts/reviewer-ux-regressions.test.mjs
          node scripts/ledger-serving.test.mjs
          node scripts/version-discovery.test.mjs
          node scripts/private-tree-boundary.test.mjs
          node scripts/information-shutdown.test.mjs
          node scripts/evidence-permissions.test.mjs
          node scripts/release-seal-precheck.test.mjs
          node scripts/media-cancellation.test.mjs
          node scripts/media-preservation.test.mjs
          node scripts/momm-release-regressions.test.mjs
          node scripts/momm-auth-recovery.test.mjs
          node scripts/momm-independent-review.test.mjs
          node momm/scripts/copilot-transport.test.mjs
          node momm/scripts/antigravity-transport.test.mjs
          node momm/scripts/shutdown.test.mjs
          node momm/scripts/attachment-cleanup.test.mjs
