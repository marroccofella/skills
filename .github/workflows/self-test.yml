          node momm/scripts/codex-isolation.test.mjs
          node momm/scripts/grok-stream.test.mjs
          node momm/scripts/roles.test.mjs
          node momm/scripts/cover.test.mjs
          node momm/scripts/invariants.test.mjs
          node momm/scripts/second-look.test.mjs
          exit $failed
      - name: Doctor (no model calls)
        if: ${{ !cancelled() }}
        run: node momm/scripts/multi-review.mjs --doctor --pretty
      - name: Native evidence permission gates (zero provider calls)
        if: ${{ !cancelled() }}
        # Native controls change access only on newly created synthetic fixtures.
        timeout-minutes: 3
        run: node scripts/evidence-permissions-native.test.mjs
      - name: Guided onboarding is zero-call and rejects unknown routes
        if: ${{ !cancelled() }}
        shell: node {0}
        run: |
          const { spawnSync } = require("node:child_process");
          const script = "momm/scripts/onboard.mjs";
          const safe = spawnSync(process.execPath, [script, "--governor", "codex", "--reviewers", "codex", "--json"], { encoding: "utf8", timeout: 30000 });
          if (safe.status !== 0) throw new Error("onboarding smoke failed: " + safe.stderr);
          const report = JSON.parse(safe.stdout);
          if (report.model_calls_made !== false || report.credential_contents_read !== false) throw new Error("onboarding privacy contract missing");
          if (report.routes.length !== 1 || report.routes[0].role !== "governor") throw new Error("governor was not self-excluded");
          const unsafe = spawnSync(process.execPath, [script, "--governor", "codex", "--reviewers", "grok,\u001b[31mBAD"], { encoding: "utf8", timeout: 30000 });
          if (unsafe.status === 0 || unsafe.stderr.includes("\u001b")) throw new Error("unknown reviewer input was not safely rejected");
          console.log("guided onboarding is zero-call, self-excluding, and input-safe");
      - name: Local Setup Center safety contract
