        run: node momm/scripts/bumble-transport.test.mjs
      - name: Setup Center JavaScript syntax
        if: ${{ !cancelled() }}
        # bash on every OS, as for the suite lists: under the Windows default (PowerShell) only the last
        # check's exit code counted. Every check runs, and the step fails if any failed.
        shell: bash
        run: |
          failed=0; trap 'echo "::error::Suite failed: $BASH_COMMAND"; failed=1' ERR; set +e
          node --check momm/scripts/setup-ui.mjs
          node --check momm/scripts/ledger.mjs
          node --check momm/scripts/multi-review.mjs
          node --check momm/assets/setup-ui/app.js
          node --check myskills/scripts/health-contract-test.mjs
          exit $failed
      - name: myrepo offline safety self-test
        if: ${{ !cancelled() }}
        run: node myrepo/scripts/publish.mjs --self-test
      - name: myskills integrated health contract
        if: ${{ !cancelled() }}
        run: node myskills/scripts/run-all.mjs --pretty
      - name: myskills canonical and quick-mode contract
        if: ${{ !cancelled() }}
        run: node myskills/scripts/health-contract-test.mjs
      - name: Yorkshire pudding self-test
        if: ${{ !cancelled() }}
        run: node yorkshire-pudding/scripts/yorkshirify.mjs --self-test
      - name: Public evidence is sanitized and sealed
        if: ${{ !cancelled() }}
        shell: node {0}
        run: |
          const { createHash } = require("node:crypto");
          const fs = require("node:fs");
          const sourcePath = "docs/evidence/momm-evidence.json";
          const sourceBytes = fs.readFileSync(sourcePath);
          const source = JSON.parse(sourceBytes.toString("utf8"));
          const html = fs.readFileSync("docs/evidence/index.html", "utf8");
          const match = html.match(/<script id="data" type="application\/json">([\s\S]*?)<\/script>/);
          if (!match) throw new Error("public evidence page has no embedded data block");
          const embedded = JSON.parse(match[1]);
          const forbidden = [
            /[A-Za-z]:[\\/]+Users[\\/]+[^\\/\s"']+/i,
            /[A-Za-z]:[\\/]+1code projects[\\/]+Claude/i,
            /(^|[\s"'(])\/(Users|home)\/[^/\s"']+/i,
          ];
          const scan = (label, value, at = "$") => {
            if (typeof value === "string") {
              if (forbidden.some((pattern) => pattern.test(value))) throw new Error(`${label} leaks a local path at ${at}: ${value}`);
              return;
            }
            if (Array.isArray(value)) return value.forEach((item, index) => scan(label, item, `${at}[${index}]`));
            if (value && typeof value === "object") for (const [key, item] of Object.entries(value)) scan(label, item, `${at}.${key}`);
          };
          scan("momm-evidence.json", source);
          scan("index.html embedded data", embedded);
          const expected = fs.readFileSync(`${sourcePath}.sha256`, "utf8").trim().split(/\s+/)[0];
          const actual = createHash("sha256").update(sourceBytes).digest("hex");
          if (actual !== expected) throw new Error(`public evidence digest mismatch: ${actual} != ${expected}`);
          console.log("public evidence contains no local home/workspace paths and matches its sidecar");
      # Legacy multi-llm-review alias must keep working until removal, and
      # with --stream its stderr must stay pure NDJSON (deprecation line included).
      # The private ledger generator must build from real telemetry and must
      # write only inside .ensemble_reviews/ (the gitignored private zone).
      - name: Private ledger builds and stays private
        if: ${{ !cancelled() }}
        shell: node {0}
        run: |
          const { spawnSync } = require("node:child_process");
          const fs = require("node:fs");
          const path = require("node:path");
          const os = require("node:os");
          const fixture = spawnSync(process.execPath, ["scripts/private-test-fixture.mjs", "momm-ledger-"], { encoding: "utf8", timeout: 30000 });
          if (fixture.status !== 0) throw new Error("private test fixture setup failed");
          const dir = fixture.stdout.trim();
          const review = spawnSync(process.execPath, [path.resolve("momm/scripts/multi-review.mjs"), "--governor", "codex", "--reviewers", "codex", "--label", "ledger smoke"], { input: "artifact\n", encoding: "utf8", cwd: dir, timeout: 120000 });
          if (review.status !== 0) throw new Error("seed review failed: " + (review.error?.code ?? review.signal ?? "exit " + review.status));
          const ledger = spawnSync(process.execPath, [path.resolve("momm/scripts/ledger.mjs")], { encoding: "utf8", cwd: dir, timeout: 60000 });
          if (ledger.status !== 0) throw new Error("ledger build failed: " + (ledger.error?.code ?? ledger.signal ?? ledger.stderr));
          const html = fs.readFileSync(path.join(dir, ".ensemble_reviews", "ledger.html"), "utf8");
          if (!html.includes("ledger smoke")) throw new Error("ledger missing run label");
          const outside = fs.readdirSync(dir).filter((f) => f !== ".ensemble_reviews");
          if (outside.length) throw new Error("ledger wrote outside the private zone: " + outside.join(","));
          // On POSIX runners, prove private evidence is owner-only (0600 files,
          // 0700 dirs) so another user on a shared machine cannot read another's
          // reviewer transcripts. Windows uses NTFS ACLs, not mode bits.
          if (process.platform !== "win32") {
            const er = path.join(dir, ".ensemble_reviews");
            const mode = (p) => fs.statSync(p).mode & 0o777;
            const dirMode = mode(er), ledgerMode = mode(path.join(er, "ledger.html"));
            const reportFile = path.join(er, "reports", fs.readdirSync(path.join(er, "reports"))[0]);
            const reportMode = mode(reportFile), logMode = mode(path.join(er, "review-log.jsonl"));
            if (dirMode & 0o077) throw new Error(".ensemble_reviews is group/other-accessible: " + dirMode.toString(8));
            if (ledgerMode & 0o077) throw new Error("ledger.html is group/other-readable: " + ledgerMode.toString(8));
            if (reportMode & 0o077) throw new Error("report is group/other-readable: " + reportMode.toString(8));
            if (logMode & 0o077) throw new Error("review-log is group/other-readable: " + logMode.toString(8));
            console.log("private evidence is owner-only (dir 0" + dirMode.toString(8) + ", files 0600)");
          }
          fs.rmSync(dir, { recursive: true, force: true });
          console.log("private ledger builds from telemetry and writes only inside .ensemble_reviews/");
      - name: Legacy alias forwards
        if: ${{ !cancelled() }}
        run: node multi-llm-review/scripts/multi-review.mjs --self-test --pretty
      - name: Legacy alias keeps --stream stderr NDJSON-pure
        if: ${{ !cancelled() }}
        shell: node {0}
        run: |
          const { spawnSync } = require("node:child_process");
          const r = spawnSync(process.execPath, ["multi-llm-review/scripts/multi-review.mjs", "--self-test", "--stream"], { encoding: "utf8" });
          const lines = r.stderr.trim().split(/\r?\n/).filter(Boolean);
          if (lines.length === 0) throw new Error("expected at least the deprecation event on stderr");
          for (const line of lines) JSON.parse(line);
          console.log(`ok: ${lines.length} stderr line(s), all valid JSON`);
      - name: Legacy install alias forwards (dry run)
        if: ${{ !cancelled() }}
        run: node multi-llm-review/scripts/install.mjs --target auto --dry-run --pretty
      # Evidence round trip: self-exclusion (zero model calls) must persist a report whose logged sha256
      # matches a fresh read of the file and whose input_sha256 matches the
      # exact piped artifact. Unavailable storage refuses before input/dispatch;
      # a later log-indexing failure still reports the successfully saved report.
      - name: Evidence persistence round trip
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        shell: node {0}
        run: |
          const { spawnSync } = require("node:child_process");
          const { createHash } = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");
          const os = require("node:os");
          const script = path.resolve("momm/scripts/multi-review.mjs");
          const artifact = "evidence round trip artifact\n";
          const dirs = [];
          const tmp = (label) => {
            const made = spawnSync(process.execPath, ["scripts/private-test-fixture.mjs", "momm-ci-" + label + "-"], { encoding: "utf8", timeout: 30000 });
            if (made.status !== 0) throw new Error("private fixture setup failed");
            const d = made.stdout.trim(); dirs.push(d); return d;
          };
          // governor codex + reviewers codex => deterministic self-exclusion:
          // zero subprocess spawns, zero network, independent of runner CLIs.
          const run = (cwd, extra = []) => spawnSync(process.execPath, [script, "--governor", "codex", "--reviewers", "codex", ...extra], { input: artifact, encoding: "utf8", cwd, timeout: 120000 });
          try {
            const workDir = tmp("ok");
            let r = run(workDir);
            if (r.status !== 0) throw new Error("run failed: " + r.stderr);
            const report = JSON.parse(r.stdout);
            if (!report.evidence.persisted || !report.evidence.log_indexed) throw new Error("evidence not fully persisted");
            if (report.evidence.report_sha256_covers !== "stored_report_bytes") throw new Error("digest coverage not declared");
            const stored = fs.readFileSync(path.join(workDir, report.evidence.report_path), "utf8");
            if (createHash("sha256").update(stored).digest("hex") !== report.evidence.report_sha256) throw new Error("report digest mismatch");
            const logLine = JSON.parse(fs.readFileSync(path.join(workDir, ".ensemble_reviews/review-log.jsonl"), "utf8").split("\n").filter(Boolean).pop());
            if (logLine.report_sha256 !== report.evidence.report_sha256) throw new Error("log digest mismatch");
            if (logLine.input_sha256 !== report.input_sha256) throw new Error("log/report input hash mismatch");
            if (report.input_sha256 !== createHash("sha256").update(artifact).digest("hex")) throw new Error("input not bound to artifact");
            if (report.reviewers[0].attempts !== 1) throw new Error("attempts not recorded");
            if ("input_text" in report) throw new Error("input stored without --store-input (privacy default broken)");
            r = run(workDir, ["--store-input"]);
            if (r.status !== 0) throw new Error("store-input run failed");
            if (JSON.parse(r.stdout).input_text !== artifact) throw new Error("--store-input did not persist the artifact");
            const blocked = tmp("blocked");
            fs.writeFileSync(path.join(blocked, ".ensemble_reviews"), "block");
            r = run(blocked);
            if (r.status !== 1 || r.stdout.trim()) throw new Error("unavailable storage must refuse before dispatch");
            if (!/cannot prepare its evidence directory/.test(r.stderr)) throw new Error("no safe storage prerequisite explanation");
            const partial = tmp("partial");
            fs.mkdirSync(path.join(partial, ".ensemble_reviews", "review-log.jsonl"), { recursive: true, mode: 0o700 });
            r = run(partial);
            if (r.status !== 0) throw new Error("partial run should still exit 0");
            const partialReport = JSON.parse(r.stdout);
            if (partialReport.evidence.persisted !== true || partialReport.evidence.log_indexed !== false) throw new Error("partial persistence misreported");
            if (!/evidence persistence failed \(review-log indexing\)/.test(r.stderr)) throw new Error("no stderr warning on indexing failure");
            if (!fs.existsSync(path.join(partial, partialReport.evidence.report_path))) throw new Error("partial run report file missing");
            const streamBlocked = tmp("stream");
            fs.writeFileSync(path.join(streamBlocked, ".ensemble_reviews"), "block");
            r = run(streamBlocked, ["--stream"]);
            if (r.status !== 1 || r.stdout.trim()) throw new Error("stream storage prerequisite must refuse before dispatch");
            const events = r.stderr.split(/\r?\n/).filter(Boolean).map((line) => JSON.parse(line));
            if (!events.some((e) => typeof e.error === "string" && /cannot prepare its evidence directory/.test(e.error))) throw new Error("no structured prerequisite error");
            console.log("evidence round trip ok: full, blocked, partial, and stream-pure failure all behave as declared");
          } finally {
            for (const d of dirs) { try { fs.rmSync(d, { recursive: true, force: true }); } catch {} }
          }

  # Owner decision, 24 September 2026. These thirteen suites passed locally but no workflow ran them,
  # so a green run implied coverage it did not have (independent review of 5f91a36). They are
  # platform-independent, make no network calls and take about four seconds together, so one Linux
  # job carries them. bash runs the whole list and fails the step if any suite failed (1.17.1 S9);
  # PowerShell would report only the last one.
  site-and-ledger:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      NO_UPDATE_CHECK: '1'
      MOMM_NO_UPDATE_CHECK: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
      - name: Site, ledger, preview, release-observer and improvement suites
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        shell: bash
        run: |
          failed=0; trap 'echo "::error::Suite failed: $BASH_COMMAND"; failed=1' ERR; set +e
          node scripts/ledger-ui.test.mjs
          node scripts/momm-improvement-regressions.test.mjs
          node scripts/momm-release-observer.test.mjs
          node scripts/momm-site-community.test.mjs
          node scripts/momm-site-discovery.test.mjs
          node scripts/momm-site-flow.test.mjs
          node scripts/momm-site-home.test.mjs
          node scripts/momm-site-regression.test.mjs
          node scripts/momm-site-search.test.mjs
          node scripts/momm-site-technical.test.mjs
          node scripts/momm-site-videos.test.mjs
          node scripts/momm-site-visuals.test.mjs
          node scripts/preview-module.test.mjs
          node scripts/ci-runner-report.test.mjs
          exit $failed
