name: MOMM public release observations
on:
  release:
    types: [published]
  workflow_dispatch:
  # Releases created with GITHUB_TOKEN do not trigger another release workflow.
  # Observe the completed trusted publisher instead; never consume its artifacts.
  workflow_run:
    workflows: [MOMM signed release]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  issues: write
concurrency:
  group: momm-public-observations
  cancel-in-progress: false
jobs:
  observe:
    if: github.repository == 'marroccofella/skills' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Execute trusted default-branch observer code, never code from the released tag.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Validate deterministic observer
        run: node scripts/momm-release-observer.test.mjs
      - name: Record observer identity
        run: echo "MOMM_CHECKER_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Observe and record public metadata only
        env:
          GH_TOKEN: ${{ github.token }}
          MOMM_RELEASE_ID: ${{ github.event.release.id }}
        run: node scripts/momm-release-observer.mjs
