name: Dom TTS portable core
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dom-tts
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15-intel, macos-14]
        node: [18, 20, 22, 24]
        include:
          - os: ubuntu-24.04-arm
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node scripts/package.js
      - run: node tests/install-check.cjs
